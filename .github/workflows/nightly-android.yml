name: Nightly Android

# Builds the nightly variant APK from main and publishes it to the rolling
# `nightly` GitHub release. Runs on every push to main and once a day.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-android
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: nightly
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      # Public identifiers of the production T3 Connect deployment, the same
      # values .env.example carries. Not secrets.
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_RELAY_URL: https://relay.t3.codes
      # Signing key for the nightly channel. Every nightly must carry the same
      # key or Android refuses to update the previous install.
      T3CODE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nightly.keystore
      T3CODE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NIGHTLY_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          NIGHTLY_KEYSTORE_BASE64: ${{ secrets.NIGHTLY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NIGHTLY_KEYSTORE_BASE64" ]; then
            echo "::error::NIGHTLY_KEYSTORE_BASE64 secret is missing; see README.md, Nightly builds."
            exit 1
          fi
          printf '%s' "$NIGHTLY_KEYSTORE_BASE64" | base64 -d > "$T3CODE_ANDROID_KEYSTORE_PATH"

      - name: Prebuild
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: "1"
          CI: "1"
        run: npx expo prebuild --clean --platform android --no-install

      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=t3code-nightly-arm64-v8a.apk
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release delete nightly --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create nightly "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
            --notes-file .github/nightly-release-notes.md
