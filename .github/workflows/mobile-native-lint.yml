name: Mobile Native Lint

# ktlint and detekt for the Kotlin sources, SwiftLint for Swift. Runs only when
# native sources or the lint configuration change, since it needs a macOS runner.
on:
  pull_request:
    paths:
      - "apps/mobile/**/*.swift"
      - "apps/mobile/**/*.kt"
      - "apps/mobile/**/*.kts"
      - "apps/mobile/.swiftlint.yml"
      - "apps/mobile/detekt.yml"
      - "apps/mobile/.editorconfig"
      - "apps/mobile/Brewfile"
      - "scripts/mobile-native-static-check.ts"
      - ".github/workflows/mobile-native-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint mobile native sources
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install lint tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint
        run: vp run lint:mobile
